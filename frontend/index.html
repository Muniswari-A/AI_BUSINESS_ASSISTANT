<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCI AI Business Assistant</title>
    <!-- Tailwind CSS for rich aesthetics -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .loader { border-top-color: #3b82f6; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [messages, setMessages] = useState([
                { sender: 'ai', text: 'Hello! I am the DCI AI Business Assistant.\nI can look up customers, complaints, check policies, and even create support tickets for you.\nHow can I help you today?' }
            ]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userText = input.trim();
                setMessages(prev => [...prev, { sender: 'user', text: userText }]);
                setInput('');
                setLoading(true);

                try {
                    const response = await fetch('/api/assistant', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userText })
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || 'Failed to get a response from the server.');
                    }
                    
                    const data = await response.json();
                    
                    let aiText = data.response || "No response received.";
                    if (data.decision && data.decision !== "NO_ACTION") {
                        aiText += `\n\n[System Action: ${data.decision}]`;
                    }
                    if (data.ticket) {
                        aiText += `\n[Ticket Status: ${data.ticket}]`;
                    }
                    
                    setMessages(prev => [...prev, { sender: 'ai', text: aiText }]);
                } catch (error) {
                    setMessages(prev => [...prev, { sender: 'ai', text: 'Error: ' + error.message }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen max-w-5xl mx-auto p-4 sm:p-6">
                    <header className="mb-6 text-center mt-4">
                        <h1 className="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                            DCI AI Business Assistant
                        </h1>
                        <p className="text-slate-400 mt-2">Powered by LangGraph, MCP, RAG & Ollama</p>
                    </header>

                    <main className="flex-1 overflow-y-auto glass rounded-2xl p-6 mb-6 flex flex-col space-y-6 shadow-2xl">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[85%] rounded-3xl px-6 py-4 whitespace-pre-wrap leading-relaxed shadow-lg ${
                                    msg.sender === 'user' 
                                    ? 'bg-blue-600 text-white rounded-br-sm' 
                                    : 'bg-slate-800 text-slate-100 rounded-bl-sm border border-slate-700/50'
                                }`}>
                                    {msg.text}
                                </div>
                            </div>
                        ))}
                        {loading && (
                            <div className="flex justify-start">
                                <div className="bg-slate-800 text-slate-100 rounded-3xl rounded-bl-sm px-6 py-4 border border-slate-700/50 shadow-lg flex items-center space-x-3">
                                    <div className="loader border-2 border-slate-500 rounded-full w-5 h-5"></div>
                                    <span className="text-slate-300 font-medium tracking-wide animate-pulse">Analyzing request...</span>
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </main>

                    <form onSubmit={sendMessage} className="glass p-3 rounded-full flex items-center shadow-xl border border-slate-700/50 focus-within:border-blue-500/50 transition-colors bg-slate-800/80">
                        <input
                            type="text"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            placeholder="Ask me to search for a customer, check a complaint, or create a ticket..."
                            className="flex-1 bg-transparent border-none outline-none px-6 text-slate-100 placeholder-slate-400 text-lg"
                            disabled={loading}
                        />
                        <button 
                            type="submit" 
                            disabled={loading || !input.trim()}
                            className="bg-gradient-to-r from-blue-500 to-indigo-500 hover:from-blue-600 hover:to-indigo-600 disabled:opacity-50 text-white rounded-full px-8 py-3 transition-all font-semibold shadow-md"
                        >
                            Send
                        </button>
                    </form>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
